<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="以损定仓与加仓计算器：按最大可承受亏损、止损价和手续费计算仓位，并支持加仓后的平均成本。">
<title>以损定仓计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 40px 20px;
    width: 100%;
    overflow-x: hidden;
    overscroll-behavior-x: none;
    touch-action: pan-y;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: visible;
  }
  .page-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    margin-bottom: 24px;
    padding-top: 4px;
    overflow: visible;
  }
  .page-header h1 {
    width: 100%;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    padding: 0 56px;
  }
  .nav-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding: 6px 11px;
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    color: #333;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .nav-btn:hover {
    background: #f0f0f0;
    border-color: #ccc;
  }
  .nav-btn:focus-visible {
    outline: 2px solid #333;
    outline-offset: 2px;
  }
  .new-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #333;
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    line-height: 1;
    padding: 3px 4px;
    border: 2px solid #fff;
    border-radius: 6px;
    pointer-events: none;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-bottom: 4px;
  }
  .input-wrap { position: relative; }
  .input-wrap .unit {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    font-size: 13px;
    pointer-events: none;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    padding-right: 32px;
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    color: #333;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #333; }
  .fee-row {
    display: flex;
    gap: 8px;
  }
  .fee-row .input-wrap { flex: 1; }
  .default-fee-btn {
    flex: 0 0 auto;
    padding: 0 12px;
    background: #333;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .default-fee-btn:hover {
    background: #555;
    border-color: #555;
  }
  .default-fee-btn:disabled {
    background: #bbb;
    border-color: #bbb;
    cursor: default;
  }
  .result {
    margin-top: 20px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
  }
  .result-row + .result-row { border-top: 1px solid #f0f0f0; }
  .result-label { font-size: 13px; color: #888; }
  .result-value { font-size: 16px; font-weight: 600; }
  .result-value.na { color: #ccc; font-weight: 400; }
  .tp-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    margin-top: 16px;
  }
  .tp-title {
    font-size: 14px;
    font-weight: 600;
    color: #555;
    margin-bottom: 12px;
  }
  @media (max-width: 400px) {
    body { padding: 24px 16px; }
    .container { padding: 24px; }
    .tp-card { padding: 20px 24px; }
  }
</style>
</head>
<body>
<div class="container" id="view-loss">
  <div class="page-header">
    <h1>以损定仓计算器</h1>
    <button class="nav-btn" type="button" data-view="add">
      加仓
      <span class="new-badge" aria-hidden="true">新</span>
    </button>
  </div>

  <div class="field">
    <label>开单价格</label>
    <div class="input-wrap">
      <input type="number" id="entry" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="field">
    <label>止损价格</label>
    <div class="input-wrap">
      <input type="number" id="stop" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="field">
    <label>最大承受止损金额</label>
    <div class="input-wrap">
      <input type="number" id="maxLoss" placeholder="0.00" step="any">
      <span class="unit">$</span>
    </div>
  </div>

  <div class="field">
    <label>手续费（单向）</label>
    <div class="fee-row">
      <div class="input-wrap">
        <input type="number" id="fee" placeholder="0.055" value="0.055" step="any">
        <span class="unit">%</span>
      </div>
      <button class="default-fee-btn" id="set-default-fee" type="button">默认</button>
    </div>
  </div>

  <div class="result">
    <div class="result-row">
      <span class="result-label">仓位数量</span>
      <span class="result-value na" id="res-qty">n/a</span>
    </div>
    <div class="result-row">
      <span class="result-label">仓位金额</span>
      <span class="result-value na" id="res-amount">n/a</span>
    </div>
    <div class="result-row">
      <span class="result-label">预计手续费（开+平）</span>
      <span class="result-value na" id="res-fee">n/a</span>
    </div>
    <div class="result-row">
      <span class="result-label">止损幅度</span>
      <span class="result-value na" id="res-pct">n/a</span>
    </div>
  </div>
</div>

<div class="container" id="view-add" hidden>
  <div class="page-header">
    <h1>加仓计算器</h1>
    <button class="nav-btn" type="button" data-view="loss">返回</button>
  </div>

  <div class="field">
    <label>持有仓位价格</label>
    <div class="input-wrap">
      <input type="number" id="holdPrice" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="field">
    <label>仓位数量</label>
    <div class="input-wrap">
      <input type="number" id="holdQty" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="field">
    <label>加仓价格</label>
    <div class="input-wrap">
      <input type="number" id="addPrice" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="field">
    <label>加仓数量</label>
    <div class="input-wrap">
      <input type="number" id="addQty" placeholder="0.00" step="any">
    </div>
  </div>

  <div class="result">
    <div class="result-row">
      <span class="result-label">平均持仓成本</span>
      <span class="result-value na" id="add-avg">n/a</span>
    </div>
    <div class="result-row">
      <span class="result-label">持仓数量</span>
      <span class="result-value na" id="add-total-qty">n/a</span>
    </div>
  </div>
</div>

<div class="tp-card" id="tp-card">
  <div class="tp-title">止盈目标价格</div>
  <div class="result-row">
    <span class="result-label">1 : 1</span>
    <span class="result-value na" id="tp-1">n/a</span>
  </div>
  <div class="result-row">
    <span class="result-label">1.5 : 1</span>
    <span class="result-value na" id="tp-15">n/a</span>
  </div>
  <div class="result-row">
    <span class="result-label">2 : 1</span>
    <span class="result-value na" id="tp-2">n/a</span>
  </div>
</div>

<script>
const defaultFeeCookieName = 'defaultFeePct';
const inputs = ['entry', 'stop', 'maxLoss', 'fee'];
const addInputs = ['holdPrice', 'holdQty', 'addPrice', 'addQty'];
const feeInput = document.getElementById('fee');
const defaultFeeButton = document.getElementById('set-default-fee');
const viewLoss = document.getElementById('view-loss');
const viewAdd = document.getElementById('view-add');
const tpCard = document.getElementById('tp-card');

applyDefaultFee();
showView(location.hash === '#add' ? 'add' : 'loss');

inputs.forEach(id => document.getElementById(id).addEventListener('input', calculate));
addInputs.forEach(id => document.getElementById(id).addEventListener('input', calculateAdd));
defaultFeeButton.addEventListener('click', saveDefaultFee);
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});
window.addEventListener('hashchange', () => {
  showView(location.hash === '#add' ? 'add' : 'loss');
});

function showView(name) {
  const isAdd = name === 'add';
  viewLoss.hidden = isAdd;
  viewAdd.hidden = !isAdd;
  tpCard.hidden = isAdd;
  document.title = isAdd ? '加仓计算器' : '以损定仓计算器';
  const nextHash = isAdd ? '#add' : '';
  if (location.hash !== nextHash) {
    history.replaceState(null, '', nextHash || location.pathname);
  }
}

function applyDefaultFee() {
  const savedFee = getCookie(defaultFeeCookieName);
  const savedFeeNumber = Number(savedFee);
  if (savedFee !== '' && !isNaN(savedFeeNumber) && savedFeeNumber >= 0) {
    feeInput.value = savedFee;
  }
}

function saveDefaultFee() {
  const fee = feeInput.value.trim();
  const feeNumber = Number(fee);
  if (fee === '' || isNaN(feeNumber) || feeNumber < 0) {
    feeInput.focus();
    return;
  }

  setCookie(defaultFeeCookieName, fee, 365);
  defaultFeeButton.textContent = '已设';
  defaultFeeButton.disabled = true;
  window.setTimeout(() => {
    defaultFeeButton.textContent = '默认';
    defaultFeeButton.disabled = false;
  }, 900);
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
  setLocalDefaultFee(name, value);
}

function getCookie(name) {
  const cookies = document.cookie ? document.cookie.split('; ') : [];
  const prefix = `${name}=`;
  const match = cookies.find(cookie => cookie.startsWith(prefix));
  return match ? decodeURIComponent(match.slice(prefix.length)) : getLocalDefaultFee(name);
}

function setLocalDefaultFee(name, value) {
  try {
    localStorage.setItem(name, value);
  } catch (error) {}
}

function getLocalDefaultFee(name) {
  try {
    return localStorage.getItem(name) || '';
  } catch (error) {
    return '';
  }
}

function setNA(id) {
  const el = document.getElementById(id);
  el.textContent = 'n/a';
  el.classList.add('na');
}

function setVal(id, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.remove('na');
}

function calculate() {
  const entry = parseFloat(document.getElementById('entry').value);
  const stop = parseFloat(document.getElementById('stop').value);
  const maxLoss = parseFloat(document.getElementById('maxLoss').value);
  const feePct = parseFloat(document.getElementById('fee').value);

  if (isNaN(entry) || isNaN(stop) || isNaN(maxLoss) || isNaN(feePct) ||
      entry <= 0 || stop <= 0 || maxLoss <= 0 || feePct < 0 || entry === stop) {
    ['res-qty', 'res-amount', 'res-fee', 'res-pct', 'tp-1', 'tp-15', 'tp-2'].forEach(setNA);
    return;
  }

  const feeRate = feePct / 100;
  const lossPerUnit = Math.abs(entry - stop);
  const feePerUnit = entry * feeRate + stop * feeRate;
  const costPerUnit = lossPerUnit + feePerUnit;

  const qty = maxLoss / costPerUnit;
  const amount = qty * entry;
  const totalFee = qty * feePerUnit;
  const stopPct = (lossPerUnit / entry) * 100;

  setVal('res-qty', formatNum(qty));
  setVal('res-amount', '$' + formatNum(amount));
  setVal('res-fee', '$' + formatNum(totalFee));
  setVal('res-pct', stopPct.toFixed(2) + '%');

  const dir = entry > stop ? 1 : -1;
  // TP fee-adjusted: net profit = ratio * costPerUnit
  // Long: tp(1 - feeRate) = ratio*costPerUnit + entry*(1+feeRate)
  // Short: tp(1 + feeRate) = entry*(1-feeRate) - ratio*costPerUnit
  function tpPrice(ratio) {
    if (dir === 1) return (ratio * costPerUnit + entry * (1 + feeRate)) / (1 - feeRate);
    else           return (entry * (1 - feeRate) - ratio * costPerUnit) / (1 + feeRate);
  }
  setVal('tp-1',  formatNum(tpPrice(1)));
  setVal('tp-15', formatNum(tpPrice(1.5)));
  setVal('tp-2',  formatNum(tpPrice(2)));
}

function calculateAdd() {
  const holdPrice = parseFloat(document.getElementById('holdPrice').value);
  const holdQty = parseFloat(document.getElementById('holdQty').value);
  const addPrice = parseFloat(document.getElementById('addPrice').value);
  const addQty = parseFloat(document.getElementById('addQty').value);

  if (isNaN(holdPrice) || isNaN(holdQty) || isNaN(addPrice) || isNaN(addQty) ||
      holdPrice <= 0 || holdQty <= 0 || addPrice <= 0 || addQty <= 0) {
    ['add-avg', 'add-total-qty'].forEach(setNA);
    return;
  }

  const totalQty = holdQty + addQty;
  const avgCost = (holdPrice * holdQty + addPrice * addQty) / totalQty;

  setVal('add-avg', formatNum(avgCost));
  setVal('add-total-qty', formatNum(totalQty));
}

function formatNum(n) {
  if (n >= 1) return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parseFloat(n.toPrecision(6)).toString();
}
</script>
</body>
</html>
